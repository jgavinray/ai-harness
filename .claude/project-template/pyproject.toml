# Ruff config lives in pyproject.toml (not ruff.toml): tooling scanners and
# ecosystem tools detect [tool.ruff*] here; a standalone ruff.toml is often missed.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
