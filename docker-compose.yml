services:
  ai-harness:
    build:
      context: .
    image: ai-harness:local
    container_name: ai-harness
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - ./harness.toml:/config/harness.toml:ro
      - ./logs:/app/logs
      - ./traces:/app/traces
      - harness-memory:/home/harness/.ai-harness
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8484/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  flywheel:
    image: ai-harness:local
    container_name: ai-harness-flywheel
    restart: unless-stopped
    command: ["python", "-m", "harness.flywheel", "--config", "/config/harness.toml"]
    volumes:
      - ./harness.toml:/config/harness.toml:ro
      - ./logs:/app/logs
      - ./traces:/app/traces
      - ./corpus:/app/corpus
      - ./evals/results:/app/evals/results
      - harness-memory:/home/harness/.ai-harness
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ai-harness:
        condition: service_started

volumes:
  harness-memory:
