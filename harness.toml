# Live config, mirroring the eval-certified "full" pipeline exactly
# (140/140 across 7 families at n=20 — docs/reports/2026-07-08-envelope-27b.md,
# generated by evals/configs.py render()). Deviations from the eval config are
# only trial-specific plumbing (log/trace/memory paths). New backends or
# features re-enter through the eval gate (evals/run.py) before landing here.

[server]
host = "0.0.0.0"   # listen on all interfaces (LAN + Tailscale); no auth, keep off untrusted networks
port = 8484

[[backends]]
name = "qwen27"
kind = "vllm"
base_url = "http://192.168.0.43:8000/v1"   # moved off .196 (retired); serves
model = "qwen3.6-27b"                      # /models/Qwen3.6-27B-int4-AutoRound,
                                           # the exact build of the 140/140 run
profile = "qwen"
context_window = 262144
# Same role surface the certified eval backend had (single-backend default),
# plus "review" for the adversarial debate sensor (spec 2026-07-19; shadow
# mode only — zero response mutation, so the certified serving behavior is
# unchanged). plan/critic roles stay absent: unmeasured side-channels.
roles = ["main", "subagent", "fast", "review"]
max_in_flight = 2

[[backends]]
name = "deepseek-v4-flash"
kind = "vllm"
base_url = "http://192.168.0.33:8888/v1"
model = "deepseek-v4-flash-dspark"   # root: deepseek-ai/DeepSeek-V4-Flash-DSpark
profile = "deepseek_r1"              # splits <think>…</think> if the model ever emits it;
# a no-op otherwise. Probed 2026-07-30: this deployment runs no --reasoning-parser
# (the `reasoning` field comes back empty), so its thinking arrives inline as
# content. OpenAI tool-calling verified working against the live endpoint.
context_window = 262144              # vLLM reports max_model_len = 262144
# reasoning ONLY. "review" deliberately stays on qwen27 (owner decision,
# 2026-07-30: no thinking model on the review path). plan/critic remain absent
# for the same reason they are absent above: unmeasured side-channels.
roles = ["reasoning"]
max_in_flight = 1   # same GB10 box as the qwen35 candidate below: sustains one request
# Switches the thinking channel on; the deepseek_r1 profile owns the field that
# does it. Without it this model reasons inline in `content` and the `reasoning`
# field comes back null; with it vLLM populates a real reasoning channel that
# base.py parses into ThinkingDelta, and tool calling still works (2026-07-30).
# reasoning_budget is deliberately NOT declared: probed the same day, this
# endpoint accepts thinking_token_budget and ignores it (budget 256 -> 1254
# reasoning chars, budget 4096 -> 1433). Declaring it would make the metrics
# report a budget that never bound. Depth here comes from max_tokens, which
# clients already send generously on reasoning turns (median 64000, min 8192
# across observed traffic).
capabilities = ["reasoning"]

