# Live config, mirroring the eval-certified "full" pipeline exactly
# (140/140 across 7 families at n=20 — docs/reports/2026-07-08-envelope-27b.md,
# generated by evals/configs.py render()). Deviations from the eval config are
# only trial-specific plumbing (log/trace/memory paths). New backends or
# features re-enter through the eval gate (evals/run.py) before landing here.
#
# The 2026-07-29 exception that ran review/critic live on deepseek-v4-flash
# ahead of an eval run is REVERTED (same day, same session): all three LLM
# sidecar paths are off again — see [review] and [critic] below for why.
# The config is back to matching the certified pipeline.

[server]
host = "0.0.0.0"   # listen on all interfaces (LAN + Tailscale); no auth, keep off untrusted networks
port = 8484

[[backends]]
name = "qwen27"
kind = "sglang"         # engine on this host switched vLLM -> SGLang, 2026-08-20;
                        # same base_url/port, in-place swap per user direction.
                        # SGLang metrics wiring (KV_USAGE_GAUGES / SGLANG_TOKEN_COUNTERS
                        # in server.py) is UNVERIFIED against a live instance — no LAN
                        # access from the dev sandbox that made this change. Confirm the
                        # /stats "kv used" and "decoded tok" numbers for this backend
                        # once deployed.
base_url = "http://192.168.0.43:8000/v1"
model = "qwen3.8-27b"   # swapped 2026-08-14, was qwen3.6-27b (root: /models/Qwen3.8-27B-NVFP4,
                        # confirmed live via GET /v1/models on 192.168.0.43:8000). Same base_url,
                        # same role surface — this is a same-backend model swap, not a new backend.
profile = "qwen"
context_window = 262144
# Same role surface the certified eval backend had (single-backend default).
# plan role stays absent: unmeasured side-channel.
roles = ["main", "subagent", "fast"]
max_in_flight = 2

[[backends]]
name = "deepseek-v4-flash"
kind = "vllm"
base_url = "http://192.168.0.33:8888/v1"
model = "deepseek-v4-flash-dspark"   # root: deepseek-ai/DeepSeek-V4-Flash-0731 as of 2026-07-31.
                                     # The served alias is stable across rebuilds; the weights are not.
profile = "deepseek_r1"              # owns thinking_request; deepseek_v4_flash's is empty, so it can't
context_window = 1048576             # vLLM reports 1048576 (re-read 2026-08-15, confirmed twice live;
                                     # 262144 set 2026-07-31 is stale). history.py:99 sizes compaction
                                     # off this, so under-declaring just wastes budget, doesn't reject.
# LIVE as of 2026-07-31 (was inert): reasoning turns route here. review/critic
# stay off below — the 2026-07-29 decision that no LLM sidecar second-guesses
# the deterministic guards is unchanged, so those roles are not declared.
roles = ["reasoning"]
# Mirrors what the backend itself configures. Measured 2026-07-29 off
# http://192.168.0.33:8888/metrics: vllm:num_requests_running pins at exactly
# 6.0 across repeated samples while kv_cache_usage_perc dips to 0.55, so the
# server's --max-num-seqs is 6 and sequence slots (not KV blocks) are the
# binding constraint. Re-measure if the deployment on that host changes.
#
# Advisory only today: at_capacity/max_in_flight is consulted in router.py for
# routed roles, but the sidecar selectors (critic.py _critic_backend,
# review.py _review_backend) filter on is_down() alone — a
# review/critic-only backend is never actually capped here. This line records
# the ceiling; it does not enforce it.
#
# Now that "reasoning" is a routed role, router.py DOES consult this: the
# ceiling stops being advisory for this backend.
max_in_flight = 6
# Maximum thinking, and it is a binary — there is no depth dial to turn up.
# Verified 2026-07-31 by diffing the rendered template off /tokenize: the whole
# mechanism is the last token of the prompt.
#   default / thinking=False -> "<|Assistant|></think>"  (block CLOSED: answer at once)
#   thinking=True            -> "<|Assistant|><think>"   (block OPEN: reason until it closes)
# This line is the half that permits sending it (relay.py:262 gates the
# profile's thinking_request on the "reasoning" capability).
#
# "reasoning_budget" is deliberately NOT declared, and that IS the max setting:
# no variable in this chat template consumes a budget, so thinking_token_budget
# is referenced by nothing. Declaring it would only make reasoning_budget.py:215
# start capping what is currently unbounded. Depth is decided by the model
# closing its own </think> plus the client's max_tokens, which the harness
# passes through unclamped. Measured: an uncapped hard-reasoning turn ran 4692
# completion tokens (~14k chars reasoning to 2.8k answer) and stopped on its own.
capabilities = ["reasoning"]

