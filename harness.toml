[debug]
dump_prompts = false

[traces]
enabled = true
layout = "partitioned"   # traces/YYYY-MM-DD/<session>.jsonl (data plane)

[pipeline]
# The certified runs used harness-owned policy (eval default), not agentic_os.
policy_owner = "harness"
system_prompt = "replace"
tool_prune = true
tool_catalog = true
max_tools = 8
fewshot = true
repair_retries = 2
recent_turns_protected = 4
reasoning = "thinking"
workflow_guards = true
# first_attempt_constraints / stream_idle_timeout_s / unverified_edit_limit
# intentionally omitted: the code defaults ARE the certified values.

[planning]
enabled = true   # no plan-role backend today -> inert, exactly as in the eval runs

[memory]
enabled = true   # default dir ~/.ai-harness/memory (container-local, best-effort)

[skills]
enabled = true   # compiler no-ops unless the skills dir exists, as in the eval runs

[research]
enabled = true

[review]
# OFF 2026-07-29. The deterministic guards (guards.py, action_state.py) are
# the frontend harness's authority on what a turn may do. Handing that
# decision to an LLM sidecar — one that cannot read files and only sees a
# truncated history window — second-guesses the guard that already decided
# correctly, which defeats the point of having the guards here at all.
# enabled=false also matters because ReviewManager.review computes
# `enabled = review.enabled or critic.enabled` (review.py:56), so both flags
# must be false to actually silence the path.
enabled = false
# mode="off" disables the adversarial debate (spec
# 2026-07-19-adversarial-review-loop). That debate was the real load: it fired
# on EVERY main/subagent/reasoning turn as a detached task, 1-2+ calls per
# round with no round cap, and drove the deepseek backend to 6 running / 55
# queued on 2026-07-29. Shadow mode never mutated a response, so turning it
# off costs zero serving behavior — only the logs/reviews/ sensor corpus and
# the flywheel's review-mining job (flywheel.py:123), both of which no-op
# cleanly when mode="off".
mode = "off"

[critic]
# OFF 2026-07-29, same reasoning as [review] above: the critic injected
# LLM-authored feedback into the conversation ahead of the executor's next
# action, overriding deterministic guard decisions the harness had already
# made. It also widened the review path — enabling critic unions 12 extra
# runtime triggers into review's trigger set (review.py:56-59).
enabled = false

# reasoning_budget stays at its default (disabled): the 140/140 certification
# ran without it. Re-enable only behind an eval delta.

[cache]
enabled = true
ttl_s = 600
roles = ["fast"]

[log]
requests_dir = "logs/requests"   # daily partitions; legacy logs/requests.jsonl* still rehydrate stats via analytics/globbing

[flywheel]
enabled = true
# nightly deterministic jobs at 03:00 local; envelope sentinel Sundays.
# Jobs run in the flywheel compose service; serving never executes them.
