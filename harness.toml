# Live config, mirroring the eval-certified "full" pipeline exactly
# (140/140 across 7 families at n=20 — docs/reports/2026-07-08-envelope-27b.md,
# generated by evals/configs.py render()). Deviations from the eval config are
# only trial-specific plumbing (log/trace/memory paths). New backends or
# features re-enter through the eval gate (evals/run.py) before landing here.

[server]
host = "0.0.0.0"   # listen on all interfaces (LAN + Tailscale); no auth, keep off untrusted networks
port = 8484

[[backends]]
name = "qwen27"
kind = "vllm"
base_url = "http://192.168.0.196:8000/v1"
model = "qwen3.6-27b"
profile = "qwen"
context_window = 262144
# Same role surface the certified eval backend had (single-backend default).
# plan/review/critic roles are deliberately absent: the 140/140 runs never
# exercised those side-channels, so enabling them here would be unmeasured.
roles = ["main", "subagent", "fast"]
max_in_flight = 2

#[[backends]]
#name = "qwen35"
#kind = "vllm"
#base_url = "http://192.168.0.33:8000/v1"
#model = "qwen36-35b-heretic"  # lost the 2026-07 bake-off: 0.79 vs 0.85, ~2x slower, rename-refactor 0/20
#profile = "qwen"
#context_window = 262144
#roles = ["candidate"]
#max_in_flight = 1  # GB10 sustains exactly one request even though vLLM accepts more

#[[backends]]
#name = "qwen80-thinking"
#kind = "vllm"
#base_url = "http://192.168.0.196:8001/v1"
#model = "qwen3-next-80b-a3b-thinking"  # down as of 2026-07-08; re-enter via eval gate
#profile = "qwen"
#context_window = 262144
#roles = ["reasoning", "plan", "review", "critic"]
#capabilities = ["reasoning", "reasoning_budget"]
#max_in_flight = 2

[debug]
dump_prompts = false

[traces]
enabled = true
layout = "partitioned"   # traces/YYYY-MM-DD/<session>.jsonl (data plane)

[pipeline]
# The certified runs used harness-owned policy (eval default), not agentic_os.
policy_owner = "harness"
system_prompt = "replace"
tool_prune = true
tool_catalog = true
max_tools = 8
fewshot = true
repair_retries = 2
recent_turns_protected = 4
reasoning = "thinking"
workflow_guards = true
# first_attempt_constraints / stream_idle_timeout_s / unverified_edit_limit
# intentionally omitted: the code defaults ARE the certified values.

[planning]
enabled = true   # no plan-role backend today -> inert, exactly as in the eval runs

[memory]
enabled = true   # default dir ~/.ai-harness/memory (container-local, best-effort)

[skills]
enabled = true   # compiler no-ops unless the skills dir exists, as in the eval runs

[research]
enabled = true

[review]
enabled = true   # no review/plan-role backend today -> skipped, exactly as in the eval runs

# critic and reasoning_budget stay at their defaults (disabled): the 140/140
# certification ran without them. Re-enable only behind an eval delta.

[cache]
enabled = true
ttl_s = 600
roles = ["fast"]

[log]
requests_dir = "logs/requests"   # daily partitions; legacy logs/requests.jsonl* still rehydrate stats via analytics/globbing
